<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="SYSOIL">
  <!--
    Marca reducida para la pestana del navegador: la gota suelta del logotipo,
    sin fondo. Los aros no se pintan de ningun color: se recortan de la gota con
    una mascara, asi que dejan pasar lo que haya detras. Es la regla del calado
    del manual resuelta sola, sea clara u oscura la barra del navegador.
    Los aros desaparecen en favicon-16x16.png: por debajo de 24px se cierran.
  -->
  <defs>
    <linearGradient id="gota" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F5DFA6" />
      <stop offset="0.5" stop-color="#C99C45" />
      <stop offset="1" stop-color="#8A5F1E" />
    </linearGradient>
    <mask id="aros">
      <g transform="translate(15.33 2) scale(0.53333)">
        <path d="M65,0 C101,52 130,74 130,115 A65,65 0 0 1 0,115 C0,74 29,52 65,0 Z" fill="#FFFFFF" />
        <path d="M-6,104 L136,62 L136,77 L-6,119 Z" fill="#000000" />
        <path d="M-6,140 L136,98 L136,113 L-6,155 Z" fill="#000000" />
      </g>
    </mask>
  </defs>
  <g mask="url(#aros)">
    <path
      transform="translate(15.33 2) scale(0.53333)"
      d="M65,0 C101,52 130,74 130,115 A65,65 0 0 1 0,115 C0,74 29,52 65,0 Z"
      fill="url(#gota)"
    />
  </g>
</svg>
