<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="SYSOIL">
  <!--
    Marca reducida para la pestana del navegador: la gota suelta del logotipo
    sobre el negro de marca. Lleva fondo opaco propio para tener silueta tanto
    en barras claras como oscuras. Sobre fondo oscuro la gota va con degradado
    y los aros calados del color del fondo, igual que en el logotipo completo.
    Los aros desaparecen en favicon-16x16.png: por debajo de 24px se cierran.
  -->
  <defs>
    <linearGradient id="gota" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F5DFA6" />
      <stop offset="0.5" stop-color="#C99C45" />
      <stop offset="1" stop-color="#8A5F1E" />
    </linearGradient>
    <clipPath id="gotaClip">
      <path
        transform="translate(19.67 8) scale(0.46667)"
        d="M65,0 C101,52 130,74 130,115 A65,65 0 0 1 0,115 C0,74 29,52 65,0 Z"
      />
    </clipPath>
  </defs>
  <rect width="100" height="100" fill="#0F1114" />
  <g transform="translate(19.67 8) scale(0.46667)">
    <path d="M65,0 C101,52 130,74 130,115 A65,65 0 0 1 0,115 C0,74 29,52 65,0 Z" fill="url(#gota)" />
  </g>
  <g clip-path="url(#gotaClip)">
    <path
      transform="translate(19.67 8) scale(0.46667)"
      d="M-6,104 L136,62 L136,77 L-6,119 Z"
      fill="#0F1114"
    />
    <path
      transform="translate(19.67 8) scale(0.46667)"
      d="M-6,140 L136,98 L136,113 L-6,155 Z"
      fill="#0F1114"
    />
  </g>
</svg>
